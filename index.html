<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創作アイデアガチャ｜物語のタネをつくる</title>
<meta name="description" content="世界観・関係性・葛藤を組み合わせて、物語のタネを作る創作支援ガチャ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   創作アイデアガチャ — スタイル
   トーン（明るさ）によって --tone 系の変数が切り替わり、
   結果エリアの色温度が変化する仕掛けになっています。
   ============================================================ */
:root{
  --bg:#FAF9FD;
  --card:#FFFFFF;
  --ink:#3B3E52;
  --ink-soft:#6E7288;
  --line:#E7E4F2;
  --accent:#8C7FD0;      /* ラベンダー */
  --accent-soft:#EFEBFA;
  --mint:#6FBFA8;
  --coral:#E8927C;
  --lock:#D9A441;
  --radius:18px;
  --radius-s:12px;
  --shadow:0 2px 12px rgba(90,80,140,.08);
  /* トーン変数（初期＝シリアス） */
  --tone:#7A8BB5;
  --tone-bg:#F2F4FA;
  --tone-deep:#5A6A94;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  line-height:1.75;
  padding-bottom:64px;
}
/* トーン別テーマ */
body[data-tone="1"]{--tone:#E8A05C;--tone-bg:#FBF3E8;--tone-deep:#C4763A}
body[data-tone="2"]{--tone:#8FB5A4;--tone-bg:#EEF5F1;--tone-deep:#5E8A77}
body[data-tone="3"]{--tone:#7A8BB5;--tone-bg:#F0F2F9;--tone-deep:#57689A}
body[data-tone="4"]{--tone:#7B6699;--tone-bg:#F0EBF5;--tone-deep:#5A4477}
body[data-tone="5"]{--tone:#584A6E;--tone-bg:#ECE8F0;--tone-deep:#3C3050}

.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---------- ヘッダー ---------- */
header{
  text-align:center;
  padding:40px 16px 26px;
  background:
    radial-gradient(ellipse 70% 100% at 20% 0%, #EFEBFA 0%, transparent 60%),
    radial-gradient(ellipse 60% 90% at 85% 10%, #E6F3EE 0%, transparent 55%),
    radial-gradient(ellipse 50% 80% at 60% 100%, #FBEEE9 0%, transparent 50%);
}
header h1{
  font-family:"Shippori Mincho",serif;
  font-size:1.9rem;
  letter-spacing:.12em;
  color:var(--ink);
}
header .sub{
  font-size:.83rem;
  color:var(--accent);
  letter-spacing:.08em;
  margin-top:6px;
}
header .desc{
  font-size:.8rem;
  color:var(--ink-soft);
  margin-top:12px;
  max-width:420px;
  margin-left:auto;margin-right:auto;
}

/* ---------- セクション共通 ---------- */
section{margin-top:26px}
.sec-title{
  font-family:"Shippori Mincho",serif;
  font-size:1.02rem;
  letter-spacing:.1em;
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
  margin-bottom:12px;
}
.sec-title::before{
  content:"";
  width:5px;height:20px;border-radius:3px;
  background:linear-gradient(180deg,var(--accent),var(--mint));
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
}

/* ---------- 設定エリア ---------- */
.setting-label{
  font-size:.78rem;color:var(--ink-soft);
  letter-spacing:.06em;margin-bottom:8px;
}
.chip-row{
  display:flex;flex-wrap:wrap;gap:8px;
}
.chip{
  border:1.5px solid var(--line);
  background:#fff;color:var(--ink-soft);
  border-radius:999px;
  padding:7px 14px;
  font-size:.82rem;
  font-family:inherit;
  cursor:pointer;
  transition:all .18s;
}
.chip:active{transform:scale(.96)}
.chip.on{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:700;
}
/* トーン選択（5段階） */
.tone-row{display:flex;gap:6px}
.tone-btn{
  flex:1;
  border:none;border-radius:var(--radius-s);
  padding:10px 2px 8px;
  font-family:inherit;font-size:.72rem;
  color:var(--ink-soft);
  background:#F3F2F8;
  cursor:pointer;
  transition:all .2s;
  line-height:1.3;
}
.tone-btn .dot{
  display:block;width:12px;height:12px;border-radius:50%;
  margin:0 auto 5px;
  background:var(--c);
  opacity:.5;
  transition:all .2s;
}
.tone-btn.on{
  background:var(--c-bg);
  color:var(--c-deep);
  font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--c);
}
.tone-btn.on .dot{opacity:1;transform:scale(1.2)}
.setting-block+.setting-block{margin-top:18px}

/* ---------- ガチャ項目 ---------- */
.gacha-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:13px 14px;
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
  border:1.5px solid transparent;
  transition:border-color .25s, background .25s;
}
.gacha-card.locked{
  border-color:var(--lock);
  background:#FDFAF2;
}
.gacha-info{flex:1;min-width:0}
.gacha-label{
  font-size:.72rem;color:var(--ink-soft);
  letter-spacing:.08em;
}
.gacha-card.locked .gacha-label::after{
  content:" 🔒ロック中";
  color:var(--lock);font-weight:700;
}
.gacha-value{
  font-size:.95rem;font-weight:700;
  line-height:1.5;
  word-break:break-word;
}
.gacha-value.rolling{animation:pop .3s ease}
@keyframes pop{
  0%{opacity:0;transform:translateY(4px)}
  100%{opacity:1;transform:translateY(0)}
}
.icon-btn{
  flex-shrink:0;
  width:42px;height:42px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:1.1rem;
  cursor:pointer;
  transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.lock-on{
  border-color:var(--lock);
  background:#FBF3DE;
}

/* ---------- 一括操作 ---------- */
.action-area{
  display:flex;flex-direction:column;gap:10px;
}
.big-btn{
  border:none;border-radius:var(--radius);
  padding:15px;
  font-family:inherit;font-size:.95rem;font-weight:700;
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  letter-spacing:.04em;
}
.big-btn:active{transform:scale(.98)}
.btn-primary{
  background:linear-gradient(135deg,#9A8CDD,#7C6EC4);
  color:#fff;
  box-shadow:0 4px 14px rgba(140,127,208,.35);
}
.btn-alt{
  background:linear-gradient(135deg,#8CCDB9,#5FAE96);
  color:#fff;
  box-shadow:0 4px 14px rgba(111,191,168,.3);
}
.btn-text{
  background:#fff;
  color:var(--accent);
  border:1.5px solid var(--accent);
}

/* ---------- 結果エリア ---------- */
.result-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border-top:4px solid var(--tone);
  padding:16px;
  margin-bottom:12px;
  transition:border-color .3s;
}
.result-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.result-title{
  font-family:"Shippori Mincho",serif;
  font-size:.92rem;
  letter-spacing:.08em;
  color:var(--tone-deep);
  transition:color .3s;
}
.copy-btn{
  border:1px solid var(--line);
  background:#fff;color:var(--ink-soft);
  border-radius:8px;
  padding:4px 10px;
  font-size:.72rem;font-family:inherit;
  cursor:pointer;
  transition:all .15s;
}
.copy-btn:active{transform:scale(.95)}
.result-body{
  font-size:.88rem;
  white-space:pre-wrap;
  word-break:break-word;
  background:var(--tone-bg);
  border-radius:var(--radius-s);
  padding:12px 14px;
  transition:background .3s;
}
.title-list{list-style:none}
.title-list li{
  background:var(--tone-bg);
  border-radius:var(--radius-s);
  padding:9px 14px;
  font-size:.9rem;font-weight:700;
  margin-bottom:6px;
  transition:background .3s;
}
.copy-all-row{display:flex;justify-content:flex-end;margin-bottom:12px}

/* ---------- 保存エリア ---------- */
.save-item{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:13px 14px;
  margin-bottom:10px;
}
.save-meta{
  display:flex;align-items:center;gap:8px;
  font-size:.72rem;color:var(--ink-soft);
}
.save-meta .tone-tag{
  padding:1px 8px;border-radius:999px;
  font-weight:700;
  background:var(--t-bg);color:var(--t-deep);
}
.save-summary{
  font-size:.84rem;
  margin-top:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.save-btn-row{
  display:flex;gap:8px;margin-top:10px;align-items:center;
}
.mini-btn{
  border:1.5px solid var(--line);
  background:#fff;color:var(--ink-soft);
  border-radius:999px;
  padding:6px 14px;
  font-size:.78rem;font-family:inherit;
  cursor:pointer;
  transition:all .15s;
}
.mini-btn:active{transform:scale(.95)}
.mini-btn.load{border-color:var(--accent);color:var(--accent)}
.mini-btn.del{border-color:#E0A8A8;color:#C97070}
.fav-btn{
  border:none;background:none;
  font-size:1.25rem;cursor:pointer;
  margin-left:auto;
  filter:grayscale(1);opacity:.4;
  transition:all .2s;
  padding:4px;
}
.fav-btn.on{filter:none;opacity:1;transform:scale(1.1)}
.empty-note{
  text-align:center;color:var(--ink-soft);
  font-size:.82rem;padding:20px 0;
}
.danger-row{text-align:center;margin-top:14px}
.danger-link{
  background:none;border:none;
  color:#C97070;font-size:.78rem;
  font-family:inherit;cursor:pointer;
  text-decoration:underline;
}

/* ---------- トースト ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  padding:10px 22px;border-radius:999px;
  font-size:.82rem;
  opacity:0;pointer-events:none;
  transition:all .3s;
  z-index:99;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- フッター ---------- */
footer{
  text-align:center;
  color:var(--ink-soft);
  font-size:.72rem;
  padding:40px 0 10px;
  letter-spacing:.06em;
}

/* ---------- アクセシビリティ ---------- */
button:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:600px){
  header h1{font-size:2.2rem}
  .action-area{flex-direction:row}
  .big-btn{flex:1}
}
</style>
</head>
<body data-tone="3">

<header>
  <h1>創作アイデアガチャ</h1>
  <p class="sub">世界観・関係性・葛藤から、物語のタネをつくる</p>
  <p class="desc">世界観・関係性・葛藤を組み合わせて、物語のタネを作る創作支援ガチャです。キャラクターそのものではなく、ショートストーリー・漫画・プロット・AIキャラ設定の「土台になるタネ」を作るツールです。</p>
</header>

<div class="wrap">

  <!-- 設定エリア -->
  <section>
    <h2 class="sec-title">設定</h2>
    <div class="card">
      <div class="setting-block">
        <p class="setting-label">出力用途</p>
        <div class="chip-row" id="purposeRow"></div>
      </div>
      <div class="setting-block">
        <p class="setting-label">明るさ（物語のトーン）</p>
        <div class="tone-row" id="toneRow"></div>
      </div>
      <div class="setting-block">
        <p class="setting-label">舞台系統フィルタ</p>
        <div class="chip-row" id="stageRow"></div>
      </div>
    </div>
  </section>

  <!-- ガチャ項目エリア -->
  <section>
    <h2 class="sec-title">ガチャ項目</h2>
    <div id="gachaArea"></div>
  </section>

  <!-- 一括操作 -->
  <section>
    <div class="action-area">
      <button class="big-btn btn-primary" id="rollAllBtn">🎲 全部ガチャ（ロックは守る）</button>
      <button class="big-btn btn-alt" id="rollDiffBtn">🍃 いつもと違うガチャ</button>
      <button class="big-btn btn-text" id="rebuildBtn">📝 出力文を作り直す</button>
    </div>
  </section>

  <!-- 結果エリア -->
  <section>
    <h2 class="sec-title">物語のタネ</h2>
    <div class="copy-all-row">
      <button class="copy-btn" id="copyAllBtn">📋 全部まとめてコピー</button>
    </div>
    <div class="result-card">
      <div class="result-head">
        <h3 class="result-title">タネの要約</h3>
        <button class="copy-btn" data-copy="summary">コピー</button>
      </div>
      <div class="result-body" id="summaryBody"></div>
    </div>
    <div class="result-card">
      <div class="result-head">
        <h3 class="result-title">詳細プロットメモ</h3>
        <button class="copy-btn" data-copy="memo">コピー</button>
      </div>
      <div class="result-body" id="memoBody"></div>
    </div>
    <div class="result-card">
      <div class="result-head">
        <h3 class="result-title">発想ヒント</h3>
        <button class="copy-btn" data-copy="hint">コピー</button>
      </div>
      <div class="result-body" id="hintBody"></div>
    </div>
    <div class="result-card">
      <div class="result-head">
        <h3 class="result-title">タイトル案</h3>
        <button class="copy-btn" data-copy="titles">コピー</button>
      </div>
      <ul class="title-list" id="titleList"></ul>
    </div>
    <button class="big-btn btn-primary" id="saveBtn" style="width:100%">💾 このタネを保存する</button>
  </section>

  <!-- 保存エリア -->
  <section>
    <h2 class="sec-title">保存したタネ</h2>
    <div id="saveList"></div>
    <div class="danger-row">
      <button class="danger-link" id="deleteAllBtn">保存したタネをすべて削除する</button>
    </div>
  </section>

</div>

<footer>創作アイデアガチャ — 物語のタネは、ここから育てるもの。</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   データ定義
   各項目： { text, tags, tones }
   tags : 舞台系統・相性マッチング用
   tones: 相性のよい明るさ(1〜5)。空配列は「どのトーンでも可」
   ============================================================
   タグ一覧：
   modern / school / underworld / research / western / wafu /
   fantasy / isekai / scifi
   ============================================================ */

// グループ一括生成ヘルパー（titleWord は任意）
function grp(tags, tones, texts){
  return texts.map(t =>
    typeof t === "string"
      ? { text: t, tags: [...tags], tones: [...tones] }
      : { text: t.text, titleWord: t.titleWord,
          tags: t.tags ?? [...tags], tones: t.tones ?? [...tones] }
  );
}

const DATA = {
  world: [
    // 現代・社会系
    ...grp(["modern"], [1,2,3,4], [
      "現代日本","地方都市","名家・旧家","芸能界","医療現場",
      "警察・探偵業界","企業社会","ネット社会","図書館都市","港町",
    ]),
    ...grp(["modern"], [2,3,4,5], [
      "宗教団体","災害後の現代","夜の歓楽街",
    ]),
    ...grp(["modern","school"], [1,2,3,4], [
      "学校","進学校","全寮制学校",
    ]),
    ...grp(["modern","school"], [2,3,4], [
      "廃校寸前の学校",
    ]),
    ...grp(["modern","underworld"], [3,4,5], [
      "地下社会","日本の裏社会",
      { text:"任侠風組織が影を落とす街", titleWord:"任侠の街" },
      { text:"イタリア系マフィアの支配する街", titleWord:"マフィアの街" },
      { text:"中華系黒社会が根を張る街", titleWord:"黒社会の街" },
      "カジノ都市",
      { text:"闇オークションが開かれる街", titleWord:"闇競売の街" },
    ]),
    // 研究・施設系
    ...grp(["research","modern"], [2,3,4], [
      "研究施設","国立研究機関","民間研究ラボ","医療研究機関","企業研究施設",
    ]),
    ...grp(["research"], [3,4,5], [
      "極秘研究所","地下研究施設","廃棄された研究所","異能研究施設",
      "生体研究所","軍事研究施設","封印研究機関",
    ]),
    // 西洋歴史・王朝系
    ...grp(["western"], [1,2,3,4], [
      "中世ヨーロッパ風","近世ヨーロッパ風","ヴィクトリア朝風",
      "宮廷社会","王都","貴族社会","海洋国家",
    ]),
    ...grp(["western"], [2,3,4,5], [
      "古代王国","砂漠の王国","帝国","亡国","戦乱前夜の王国",
      { text:"王位継承争いの渦中にある国", titleWord:"継承の国" },
    ]),
    // 和風・古代日本系
    ...grp(["wafu"], [1,2,3,4], [
      "古代日本風","奈良時代風","平安時代風","王朝文化の都",
      "貴族社会の都",
      { text:"神祇祭祀の残る里", titleWord:"祭祀の里" },
      "山岳信仰の地",
    ]),
    ...grp(["wafu"], [2,3,4,5], [
      { text:"陰陽寮のある都", titleWord:"陰陽の都" },
      "辺境の国府",
      { text:"古代豪族の支配地", titleWord:"豪族の地" },
      { text:"神に仕える一族の里", titleWord:"神仕えの里" },
      "戦国風","和風王朝",
    ]),
    // ファンタジー系
    ...grp(["fantasy"], [1,2,3,4], [
      "魔法世界","魔法学校",
      { text:"精霊と契約する世界", titleWord:"精霊契約" },
      { text:"魔物と共存する世界", titleWord:"魔物の隣" },
      "迷宮都市","浮遊大陸",
      { text:"妖と人が共存する都", titleWord:"妖の都" },
    ]),
    ...grp(["fantasy"], [2,3,4,5], [
      { text:"魔法が制度化された世界", titleWord:"魔法制度" },
      { text:"神々が実在する世界", titleWord:"神々の世" },
      { text:"呪いが制度に組み込まれた世界", titleWord:"呪いの制度" },
      { text:"竜が支配する王国", titleWord:"竜の王国" },
      { text:"勇者制度のある世界", titleWord:"勇者制度" },
      { text:"聖女制度のある世界", titleWord:"聖女制度" },
      { text:"召喚が国家事業になっている世界", titleWord:"召喚国家" },
      { text:"契約神を持つ貴族社会", titleWord:"契約神の家" },
    ]),
    ...grp(["fantasy","wafu"], [2,3,4,5], [
      { text:"言霊が力を持つ世界", titleWord:"言霊の世" },
      "和風ファンタジー",
      { text:"和歌や言霊に力が宿る世界", titleWord:"言の葉の力" },
      { text:"黄泉との境が近い村", titleWord:"黄泉境の村" },
      { text:"鬼が封じられた地方国", titleWord:"鬼封じの国" },
    ]),
    // 異世界転生系
    ...grp(["isekai","fantasy"], [1,2,3,4], [
      { text:"異世界転生後の世界", titleWord:"二度目の世界" },
      "剣と魔法の王国",
      { text:"乙女ゲーム風の貴族社会", titleWord:"乙女ゲームの国" },
      { text:"スキルとレベルが存在する世界", titleWord:"スキルの世界" },
      { text:"ダンジョン経済で成り立つ都市", titleWord:"ダンジョン都市" },
      { text:"魔法学院のある異世界", titleWord:"魔法学院" },

/* ============================================================
   抽選ロジック（タグ相性・トーン相性の重み付き抽選）
   ============================================================ */
function weightedPick(list, weightFn){
  const weights = list.map(weightFn);
  const total = weights.reduce((a,b)=>a+b,0);
  if (total <= 0) return list[Math.floor(Math.random()*list.length)];
  let r = Math.random() * total;
  for (let i=0;i<list.length;i++){
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length-1];
}

// 現在の世界観タグ・トーン・舞台フィルタを考慮して1件抽選
function pickItem(catKey, { differentMode=false } = {}){
  let pool = DATA[catKey];
  const worldTags = catKey === "world" ? [] : (state.items.world?.tags ?? []);

  // 舞台フィルタ：世界観は厳密に、他項目はゆるやかに反映
  if (state.stage !== "all"){
    if (catKey === "world"){
      const filtered = pool.filter(it => it.tags.includes(state.stage));
      if (filtered.length) pool = filtered;
    }
  }

  return weightedPick(pool, it => {
    let w = 1;
    // タグ相性：世界観とタグが一致する項目を優先（乗算で強く効かせる）
    if (catKey !== "world"){
      if (it.tags.length === 0) w *= 1.6;                          // 汎用項目はやや優遇
      else if (it.tags.some(t => worldTags.includes(t))) w *= 4.5; // 相性一致は強く優遇
      else w *= 0.12;                                              // 系統違いはかなり出にくく
    }
    // トーン相性
    if (differentMode){
      // いつもと違うガチャ：明るめ(1-2)対応の項目を強く優遇
      w *= (it.tones.includes(1) || it.tones.includes(2)) ? 2.5 : 0.1;
    } else {
      w *= it.tones.includes(state.tone) ? 2.0 : 0.25;
    }
    return w;
  });
}

// 2つの文が4文字以上の共通部分を持つか（近似重複の判定）
function tooSimilar(a, b){
  if (!a || !b) return false;
  for (let i = 0; i + 4 <= a.length; i++){
    if (b.includes(a.slice(i, i + 4))) return true;
  }
  return false;
}

function rollOne(key, opts){
  if (state.locks[key]) return;
  // 他項目と内容が被りすぎたら引き直す（最大5回）
  const others = CATS.filter(c => c.key !== key)
    .map(c => state.items[c.key]?.text)
    .filter(Boolean);
  let picked;
  for (let i = 0; i < 5; i++){
    picked = pickItem(key, opts);
    if (!others.some(t => tooSimilar(picked.text, t))) break;
  }
  state.items[key] = picked;
}

function rollAll(opts = {}){
  // 世界観を先に決め、他項目の相性判定に使う
  rollOne("world", opts);
  for (const c of CATS){
    if (c.key !== "world") rollOne(c.key, opts);
  }
}

  3: "葛藤を正面から描き、選択の重さを物語の芯にする。",
  4: "愛憎・裏切り・喪失の陰影を濃いめに。感情の底を見せる。",
  5: "終末感を漂わせ、救いを安売りしない。それでも残るものを描く。",
};

// タグ別の発想ヒント（役割・立場の例）
const ROLE_HINTS = {
  school: ["事情を知ってしまった同級生","見て見ぬふりを続けてきた大人","外部から来た臨時教員"],
  research: ["記録を任された末端の研究員","施設に出入りする外部監査役","かつてここにいた元関係者"],
  underworld: ["組織に借りのある堅気の人間","敵対組織から送り込まれた密偵","足を洗おうとしている古株"],
  western: ["継承権を持たない末子","宮廷の噂を集める侍従","没落した名家の生き残り"],
  wafu: ["神託を読み違えた神官","都から左遷された役人","人ならざるものと縁を持つ子ども"],
  fantasy: ["契約に縛られた魔術師","制度の外で生きる流れ者","力を持たない側の人間"],
  isekai: ["原作知識を持つ転生者","物語のモブだったはずの人物","同じ前世の記憶を持つもう一人"],
  scifi: ["システムの綻びに気づいた管理者","記録から消された市民","旧時代を知る最後の世代"],
  modern: ["事情を知ってしまった部外者","過去に同じ経験をした年長者","すべてを記録している傍観者"],
  generic: ["秘密を最初に知る立場の人物","当事者たちの間を行き来する媒介役","過去に同じ選択を迫られた先達"],
};

function getRoleHints(){
  const tags = state.items.world?.tags ?? [];
  for (const t of ["research","underworld","isekai","wafu","school","fantasy","scifi","western","modern"]){
    if (tags.includes(t)) return ROLE_HINTS[t];
  }
  return ROLE_HINTS.generic;
}

// タネの要約
function buildSummary(){
  const w=util.t("world"), g=util.t("genre"), r=util.t("relation"),
        i=util.t("incident"), c=util.t("conflict"), gi=util.t("gimmick");
  const tail = util.pick(TONE_TAILS[state.tone]);

  switch (state.purpose){
    case "一言ネタ":
      return `${w}で、「${r}」の二人（あるいは人々）が「${i}」に巻き込まれる話。鍵になるのは「${gi}」。`;
    case "三題噺向け":
      return `お題：「${w}」「${gi}」「${i}」\nこの三つを、「${r}」の関係性でつなぐ${g}。\n${tail}`;
    case "世界観メモ":
      return `${w}を舞台にした${g}。この世界では「${gi}」が物語のルールとして機能している。${tail}`;
    default:
      return `${w}を舞台にした${g}。「${r}」の間で「${i}」が起き、「${c}」という板挟みが生まれる。${tail}`;
  }
}

// 詳細プロットメモ
function buildMemo(){
  const lines = [
    `■ ジャンル：${util.t("genre")}`,
    `■ 世界観　：${util.t("world")}`,
    `■ 関係性　：${util.t("relation")}`,
    `■ 中心事件：${util.t("incident")}`,
    `■ 葛藤　　：${util.t("conflict")}`,
    `■ ギミック：${util.t("gimmick")}`,
    `■ ひねり　：${util.t("twist")}`,
  ];

  let direction = `物語は「${util.t("incident")}」から動き出し、「${util.t("gimmick")}」を軸に進行する。終盤、「${util.t("twist")}」という反転が待つ。${TONE_DIRECTION[state.tone]}`;

  // 用途別の追記
  switch (state.purpose){
    case "漫画1話向け":
      direction += `\n1話の引きは「${util.t("incident")}」の直後に置くと強い。冒頭3ページで関係性を、ラスト1ページで違和感を見せる構成が扱いやすい。`;
      break;
    case "連載プロット向け":
      direction += `\n長期の縦軸は「${util.t("conflict")}」。「${util.t("gimmick")}」は一度に明かさず、各話の横軸として小出しにすると引きが持続する。「${util.t("twist")}」は中盤の折り返しか最終盤に配置。`;
      break;
    case "ショートストーリー向け":
      direction += `\n短編なら描く時間を「${util.t("incident")}」の前後数日に絞り、「${util.t("twist")}」をラスト一行の余韻に使うとまとまりやすい。`;
      break;
    case "世界観メモ":
      direction += `\n世界のルール案：この世界では「${util.t("gimmick")}」が制度・慣習・信仰のいずれかに組み込まれている。誰がそれを管理し、誰が例外なのかを決めると世界が立ち上がる。`;
      break;
    case "一言ネタ":
      direction = `一言で言えば——「${util.t("conflict")}」の話。膨らませるなら「${util.t("twist")}」を切り札に。`;
      break;
    case "三題噺向け":
      direction += `\n三題噺なら「${util.t("world")}」「${util.t("gimmick")}」「${util.t("incident")}」の三要素を必ず登場させること。`;
      break;
  }

  return lines.join("\n") + `\n\n■ 物語の方向性\n${direction}`;
}

// 発想ヒント
function buildHint(){
  const roles = getRoleHints();
  const r2 = [...roles].sort(()=>Math.random()-.5).slice(0,2);
  const rel = util.t("relation"), inc = util.t("incident"),
        gi = util.t("gimmick"), cf = util.t("conflict"), tw = util.t("twist");

  // 基本：役割の置き方
  const base = `この設定なら、「${r2[0]}」や「${r2[1]}」のような立場の人物を置くと動かしやすい。`;

  // パターンプール（毎回2つをランダムに選ぶ）
  const patterns = [
    // 対立構造ヒント
    `対立軸の候補：「${gi}」を守りたい側と、暴きたい側。「${rel}」の二人をこの軸のどちらに割り振るかで、物語の温度が決まる。`,
    // 秘密の持たせ方ヒント
    `秘密の置き方：「${gi}」を知っているのは誰か。片方だけが知っている構図にすると、「${cf}」という葛藤が日常の会話にまで滲み出す。`,
    // 物語開始時点のヒント
    util.pick([
      `開始点の候補：「${inc}」の直前から始めると、読者だけが予兆に気づく構成が作れる。`,
      `開始点の候補：「${inc}」の直後から始めると、説明を省いて混乱の中から関係性を見せられる。`,
      `開始点の候補：「${inc}」から数年後に置くと、「あの日何があったのか」を軸にした回想構造が組める。`,
    ]),
    // 反転ヒント
    `「${rel}」の力関係は、「${inc}」をきっかけに反転させると物語が転がる。`,
    // ひねりの伏線ヒント
    `「${tw}」を最後に効かせるなら、序盤に一度だけ、意味が分からない形で予兆を置いておくと着地が締まる。`,
  ];
  const picked = [...patterns].sort(()=>Math.random()-.5).slice(0,2);

  let hint = [base, ...picked].join("\n");

  // 用途別の専用ブロック
  switch (state.purpose){
    case "AIキャラプロットの種":
      hint += `\n\n◆ キャラAIの土台にするなら\n`
        + `・AIキャラ側：「${rel}」のうち、「${gi}」に縛られている（＝秘密や事情を抱えている）側にすると、会話の裏に含みが生まれて動きやすい。\n`
        + `・ユーザー側：その事情に気づきかけている立場に置くと、最初の一言から緊張感が作れる。\n`
        + `・最初の会話の火種：「${inc}」${util.pick(["の直後、まだ状況を整理できていない場面","の噂を耳にした場面","について問いただそうとする場面"])}から始めると、説明台詞なしで関係性が見える。`;
      break;
    case "ショートストーリー向け":
      hint += `\nラスト一文の型：「${tw}」を、断言ではなく気配で置く。例えば「${util.pick(["まだ誰も、そのことに気づいていない。","それを知るのは、もう少し先の話だ。","——そのはずだった。"])}」のような余韻の残し方が短編には効く。`;
      break;
    case "漫画1話向け":
      hint += `\n1話の引きの型：ラストコマは「${inc}」${util.pick(["の瞬間で切る","の直後、相手の表情だけを見せる","を知った側の顔で終える"])}と、2話への引力が強い。`;
      break;
    default:
      hint += `\n「${gi}」を知っている人物と知らない人物を分けると、視点の置き方が決めやすい。`;
  }
  return hint;
}

// タイトル案
const TITLE_NOUNS_LIGHT = ["約束","レシピ","めぐりあい","日和","はじまり","放課後"];
const TITLE_NOUNS_MID   = ["行方","輪郭","在り処","証明","境界線","残響"];
const TITLE_NOUNS_DARK  = ["檻","終焉","残骸","罪科","葬送","果て"];

function shortWord(text){
  // 長い項目文からタイトル用の短い言葉を切り出す（フォールバック用）
  const t = text.replace(/、.*$/,"").replace(/する$|される$|になる$/,"");
  return t.length <= 8 ? t : t.slice(0,8);
}

// titleWord があれば優先、なければ shortWord にフォールバック
function titleWordOf(key){
  const it = state.items[key];
  if (!it) return "—";
  return it.titleWord ?? shortWord(it.text);
}

function buildTitles(){
  const gi = titleWordOf("gimmick");
  const w  = titleWordOf("world");
  const i  = titleWordOf("incident");
  const nouns = state.tone <= 2 ? TITLE_NOUNS_LIGHT : state.tone === 3 ? TITLE_NOUNS_MID : TITLE_NOUNS_DARK;
  const n1 = util.pick(nouns);
  let n2 = util.pick(nouns);
  if (n2 === n1) n2 = util.pick(nouns);

  const candidates = [
    `${gi}の${n1}`,
    `${w}と${n2}`,
    `『${i}』のあとで`,
    `きみと${gi}`,
    `${i}、あるいは${n1}`,
  ];
  return [...candidates].sort(()=>Math.random()-.5).slice(0,3);
}

function buildTexts(){
  state.texts = {
    summary: buildSummary(),
    memo: buildMemo(),
    hint: buildHint(),
    titles: buildTitles(),
  };
}

/* ============================================================
   描画
   ============================================================ */
const $ = id => document.getElementById(id);

function renderSettings(){
  // 出力用途
  $("purposeRow").innerHTML = PURPOSES.map(p =>
    `<button class="chip ${p===state.purpose?"on":""}" data-purpose="${p}">${p}</button>`
  ).join("");
  // トーン
  $("toneRow").innerHTML = TONES.map(t =>
    `<button class="tone-btn ${t.v===state.tone?"on":""}" data-tone-v="${t.v}"
      style="--c:${t.c};--c-bg:${t.bg};--c-deep:${t.deep}">
      <span class="dot"></span>${t.label}</button>`
  ).join("");
  // 舞台フィルタ
  $("stageRow").innerHTML = STAGES.map(s =>
    `<button class="chip ${s.key===state.stage?"on":""}" data-stage="${s.key}">${s.label}</button>`
  ).join("");
  document.body.dataset.tone = state.tone;
}

function renderGacha(animKey){
  $("gachaArea").innerHTML = CATS.map(c => {
    const locked = state.locks[c.key];
    const anim = (animKey === "all" || animKey === c.key) ? "rolling" : "";
    return `<div class="gacha-card ${locked?"locked":""}">
      <div class="gacha-info">
        <p class="gacha-label">${c.label}</p>
        <p class="gacha-value ${anim}">${state.items[c.key]?.text ?? "—"}</p>
      </div>
      <button class="icon-btn" data-roll="${c.key}" aria-label="${c.label}を再抽選" ${locked?"disabled":""}>🎲</button>
      <button class="icon-btn ${locked?"lock-on":""}" data-lock="${c.key}" aria-label="${c.label}のロックを切り替え">${locked?"🔒":"🔓"}</button>
    </div>`;
  }).join("");
}

function renderResults(){
  $("summaryBody").textContent = state.texts.summary;
  $("memoBody").textContent = state.texts.memo;
  $("hintBody").textContent = state.texts.hint;
  $("titleList").innerHTML = state.texts.titles.map(t=>`<li>${t}</li>`).join("");
}

function renderSaved(){
  const saved = loadSaved();
  if (!saved.length){
    $("saveList").innerHTML = `<p class="empty-note">保存されたタネはまだありません。<br>気に入った組み合わせができたら保存してみてください。</p>`;
    return;
  }
  // お気に入りを先頭に、次に新しい順
  const sorted = [...saved].sort((a,b)=> (b.fav?1:0)-(a.fav?1:0) || b.id - a.id);
  $("saveList").innerHTML = sorted.map(s => {
    const t = TONES.find(x=>x.v===s.tone) ?? TONES[2];
    return `<div class="save-item">
      <div class="save-meta">
        <span>${s.date}</span>
        <span class="tone-tag" style="--t-bg:${t.bg};--t-deep:${t.deep}">${t.label}</span>
        <span>${s.purpose}</span>
        <button class="fav-btn ${s.fav?"on":""}" data-fav="${s.id}" aria-label="お気に入り切り替え">⭐</button>
      </div>
      <p class="save-summary">${s.texts.summary}</p>
      <div class="save-btn-row">
        <button class="mini-btn load" data-load="${s.id}">読み込む</button>
        <button class="mini-btn del" data-del="${s.id}">削除</button>
      </div>
    </div>`;
  }).join("");
}

function renderAll(animKey){
  renderSettings();
  renderGacha(animKey);
  renderResults();
  renderSaved();
}

/* ============================================================
   保存（localStorage）
   ============================================================ */
function persistState(){
  try{
    localStorage.setItem(LS_STATE, JSON.stringify({
      items: state.items, locks: state.locks,
      tone: state.tone, purpose: state.purpose, stage: state.stage,
      texts: state.texts,
    }));
  }catch(e){ /* プライベートモード等では保存不可 */ }
}

function loadSaved(){
  try{
    return JSON.parse(localStorage.getItem(LS_SAVED) ?? "[]");
  }catch(e){ return []; }
}

function saveCurrent(){
  const saved = loadSaved();
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  saved.push({
    id: Date.now(),
    date: `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    items: state.items,
    locks: state.locks,
    tone: state.tone,
    purpose: state.purpose,
    stage: state.stage,
    texts: state.texts,
    fav: false,
  });
  try{
    localStorage.setItem(LS_SAVED, JSON.stringify(saved));
    toast("保存しました 💾");
  }catch(e){
    toast("保存できませんでした（容量またはブラウザ設定）");
  }
  renderSaved();
}

function updateSaved(list){
  try{ localStorage.setItem(LS_SAVED, JSON.stringify(list)); }catch(e){}
  renderSaved();
}

/* ============================================================
   ユーティリティ
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1800);
}

async function copyText(text, label){
  try{
    await navigator.clipboard.writeText(text);
    toast(`${label}をコピーしました 📋`);
  }catch(e){
    // フォールバック
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast(`${label}をコピーしました 📋`);
  }
}

function fullText(){
  return [
    "◆ タネの要約",
    state.texts.summary,
    "",
    "◆ 詳細プロットメモ",
    state.texts.memo,
    "",
    "◆ 発想ヒント",
    state.texts.hint,
    "",
    "◆ タイトル案",
    ...state.texts.titles.map(t=>"・"+t),
  ].join("\n");
}

/* ============================================================
   イベント
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;

  // 個別ガチャ
  if (el.dataset.roll){
    rollOne(el.dataset.roll);
    buildTexts();
    renderAll(el.dataset.roll);
    persistState();
    return;
  }
  // ロック切り替え
  if (el.dataset.lock){
    state.locks[el.dataset.lock] = !state.locks[el.dataset.lock];
    renderGacha();
    persistState();
    return;
  }
  // トーン
  if (el.dataset.toneV){
    state.tone = Number(el.dataset.toneV);
    buildTexts();
    renderAll();
    persistState();
    return;
  }
  // 用途
  if (el.dataset.purpose){
    state.purpose = el.dataset.purpose;
    buildTexts();
    renderAll();
    persistState();
    return;
  }
  // 舞台フィルタ：変更したらロック以外を自動で再抽選
  if (el.dataset.stage){
    state.stage = el.dataset.stage;
    const label = STAGES.find(s=>s.key===state.stage).label;
    if (state.locks.world){
      // 世界観ロック中はフィルタ設定のみ変更
      renderSettings();
      toast(`世界観がロック中のため、次回のガチャから反映されます`);
    } else {
      rollAll();
      buildTexts();
      renderAll("all");
      toast(`舞台を「${label}」に切り替えました`);
    }
    persistState();
    return;
  }
  // コピー（個別）
  if (el.dataset.copy){
    const map = {
      summary: [state.texts.summary, "要約"],
      memo:    [state.texts.memo, "プロットメモ"],
      hint:    [state.texts.hint, "発想ヒント"],
      titles:  [state.texts.titles.map(t=>"・"+t).join("\n"), "タイトル案"],
    };
    const [text, label] = map[el.dataset.copy];
    copyText(text, label);
    return;
  }
  // 保存一覧の操作
  if (el.dataset.load){
    const s = loadSaved().find(x => x.id === Number(el.dataset.load));
    if (s){
      state.items = s.items;
      state.locks = s.locks ?? {};
      state.tone = s.tone;
      state.purpose = s.purpose;
      state.stage = s.stage ?? "all";
      state.texts = s.texts;
      renderAll();
      persistState();
      toast("読み込みました");
      window.scrollTo({top:0, behavior:"smooth"});
    }
    return;
  }
  if (el.dataset.del){
    if (confirm("このタネを削除しますか？")){
      updateSaved(loadSaved().filter(x => x.id !== Number(el.dataset.del)));
      toast("削除しました");
    }
    return;
  }
  if (el.dataset.fav){
    const list = loadSaved();
    const s = list.find(x => x.id === Number(el.dataset.fav));
    if (s){ s.fav = !s.fav; updateSaved(list); }
    return;
  }
});

$("rollAllBtn").addEventListener("click", () => {
  rollAll();
  buildTexts();
  renderAll("all");
  persistState();
});

$("rollDiffBtn").addEventListener("click", () => {
  rollAll({ differentMode:true });
  // トーンも明るめに寄せる
  if (state.tone >= 3) state.tone = Math.random() < 0.5 ? 1 : 2;
  buildTexts();
  renderAll("all");
  persistState();
  toast("いつもと違う風が吹きました 🍃");
});

$("rebuildBtn").addEventListener("click", () => {
  buildTexts();
  renderResults();
  persistState();
  toast("出力文を作り直しました");
});

$("saveBtn").addEventListener("click", saveCurrent);

$("copyAllBtn").addEventListener("click", () => copyText(fullText(), "すべて"));

$("deleteAllBtn").addEventListener("click", () => {
  const saved = loadSaved();
  if (!saved.length){ toast("保存されたタネはありません"); return; }
  if (confirm(`保存した ${saved.length} 件のタネをすべて削除します。よろしいですか？`)){
    updateSaved([]);
    toast("すべて削除しました");
  }
});

/* ============================================================
   初期化
   ============================================================ */
(function init(){
  let restored = false;
  try{
    const s = JSON.parse(localStorage.getItem(LS_STATE) ?? "null");
    if (s && s.items && s.items.world){
      state = { ...state, ...s };
      restored = true;
    }
  }catch(e){}

  if (!restored){
    rollAll();
    buildTexts();
  }
  renderAll();
})();
</script>
